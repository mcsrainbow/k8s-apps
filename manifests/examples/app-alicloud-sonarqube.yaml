---
apiVersion: v1
kind: Namespace
metadata:
  name: sonar
---
apiVersion: v1
kind: Secret
metadata:
  namespace: sonar
  name: sonarqube-secret-postgresql
type: Opaque
stringData:
  password: sonarqube
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: sonar
  name: sonarqube-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarqube
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: sonarqube-volume
          persistentVolumeClaim:
            claimName: sonarqube-pvc
      initContainers:
        - name: init-dirs
          image: busybox
          command:
            - sh
            - -c
            - |
              mkdir -p /mnt/data /mnt/extensions
              chown -R 1000:1000 /mnt/data /mnt/extensions
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: sonarqube-volume
              mountPath: /mnt
      containers:
        - name: sonarqube
          image: sonarqube:26.4.0.121862-community
          args:
            - -Dsonar.web.context=/sonar
            - -Dsonar.core.serverBaseURL=https://devops.example.com/sonar
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              protocol: TCP
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: sonarqube-volume
              mountPath: /opt/sonarqube/data
              subPath: data
            - name: sonarqube-volume
              mountPath: /opt/sonarqube/extensions
              subPath: extensions
          readinessProbe:
            httpGet:
              path: /sonar/api/system/status
              port: 9000
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 3
            successThreshold: 2
            timeoutSeconds: 5
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: SONAR_JDBC_USERNAME
              value: sonar
            - name: SONAR_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonarqube-secret-postgresql
                  key: password
            - name: SONAR_JDBC_URL
              value: jdbc:postgresql://postgres.example.com:5432/sonar
            - name: aliyun_logs_log-sonar-stdout
              value: stdout
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  namespace: sonar
  name: sonarqube-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  selector:
    matchLabels:
      alicloud-pvname: sonarqube-pv
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarqube-pv
  labels:
    alicloud-pvname: sonarqube-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  csi:
    driver: nasplugin.csi.alibabacloud.com
    volumeHandle: sonarqube-pv
    volumeAttributes:
      server: "857abc857a-bc85.cn-hangzhou.nas.aliyuncs.com"
      path: "/sonarqube"
  mountOptions:
    - nolock,tcp,noresvport
    - vers=3
---
apiVersion: v1
kind: Service
metadata:
  namespace: sonar
  name: sonarqube-svc
spec:
  selector:
    app: sonarqube
  clusterIP: None
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: sonar
  name: sonarqube-ingress
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - devops.example.com
  rules:
    - host: devops.example.com
      http:
        paths:
          - path: /sonar
            pathType: Prefix
            backend:
              service:
                name: sonarqube-svc
                port:
                  number: 9000
